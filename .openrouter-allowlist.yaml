# .openrouter-allowlist.yaml — pre-cleared OpenRouter-literal matches for
# vires (alpha-engine-config-I9092: the guard did not exist in this repo
# before I9092 — vires-coach's flip surface reached a live direct-OpenRouter
# linkage undetected on main for an unknown period).
#
# Updated 2026-08-29 (krepis-router migration, vires-ops-I<N>):
# _reject_direct_openrouter was superseded by the more general
# _reject_non_router_override (Brian's 2026-08-29 ruling retires
# direct-Anthropic too and requires every call to funnel through the krepis
# router — the narrower per-provider guard this file's entries described no
# longer exists in the source, so the base_url/provider_comparison/attr_key
# entries it pinned are now removed rather than re-pointed at nothing;
# `openrouter_guard.py --repo .` confirmed each is stale post-migration).
#
# Schema: nousergon-lib scripts/openrouter_guard.py::load_allowlist. Every
# entry needs path, pattern, reason, expires (YYYY-MM-DD — a past date fails
# CI loudly), and tracking.
#
# Every entry below is prose (docstrings/comments naming the ruling this repo
# now complies with) or the defensive check / regression test that PROVES
# compliance — not a live call site. There is no genuinely-unmigrated entry
# in this file: no path in the coach can construct a direct OpenRouter (or
# any other direct-provider) linkage any more.
schema_version: 1
entries:
  - path: api/config.py
    pattern: attr_key
    reason: >-
      Comment explaining that there is deliberately no anthropic_api_key /
      openrouter_api_key setting any more (I9092, generalized 2026-08-29) —
      names the identifiers it documents the absence of, not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9092
  - path: infrastructure/deploy-on-merge.sh
    pattern: env_key
    reason: >-
      Scrubs any VIRES_OPENROUTER_API_KEY a PRIOR deploy left in .env — the
      opposite of a linkage: this line only ever removes the credential, and
      no code path in the app reads it anymore (I9092; generalized further
      2026-08-29 to scrub the retired Anthropic key too).
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9092
  - path: tests/test_coach.py
    pattern: provider_literal
    reason: >-
      Regression test fixture constructs an openrouter-naming (JSON-form)
      flip value on purpose to assert _resolve_spec raises CoachUnavailable
      naming the router requirement. A test asserting the ban is enforced
      is not a call site.
    expires: "2027-08-29"
    tracking: alpha-engine-config-I9092
