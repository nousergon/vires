[project]
name = "vires"
version = "0.1.0"
description = "Strength-training tracker with hybrid exercise search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Brian McMahon", email = "brian@nousergon.ai" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.15.0",
    "fastembed>=0.4",
    "numpy>=1.26",
    "httpx>=0.27",
    # Guards untrusted GPX-file XML parsing against entity-expansion/DTD
    # attacks (api/services/geo/gpx.py, config-I2632) — stdlib ElementTree
    # resolves DOCTYPE-declared entities by default.
    "defusedxml>=0.7.1",
    # krepis router-edge LLM adapter, OpenAI-compatible transport only
    # (2026-08-29 migration: every resolvable coach ModelSpec routes through
    # the krepis router edge, which speaks the openai-compatible wire — the
    # anthropic transport / SDK is never reachable from this call site any
    # more, so the [anthropic] extra was dropped; see
    # api/services/coach/agent.py's _default_spec / _reject_non_router_override).
    "krepis[openai]>=0.59.14",
    "pywebpush>=2.4.0",
    # Verifies nousergon-auth's EdDSA/Ed25519 JWTs against its JWKS
    # (vires-ops#60) — [crypto] pulls in `cryptography` for the Ed25519 path.
    "pyjwt[crypto]>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "genbadge[coverage]>=1.1.3",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is the intended idiom

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["api"]
omit = ["api/db/seed.py"]  # one-shot catalog seeding, not unit-tested

[tool.coverage.report]
# Native coverage GATE: CI fails if backend coverage drops below this floor.
# Ratchet — raise as coverage improves (currently ~92%).
fail_under = 85
