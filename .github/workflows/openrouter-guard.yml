name: OpenRouter direct-linkage guard

# Thin caller — all scan behavior lives in the reusable workflow. Edit it
# there, not here: nousergon/nousergon-lib/.github/workflows/openrouter-guard.yml
#
# alpha-engine-config-I9092 (epic I6367, Brian's 2026-08-03 ruling: no agent
# may be directly linked to OpenRouter). This repo held a registered
# LLM_CALLSITE_REGISTRY.yaml callsite with an operator flip surface reaching
# OpenRouter with zero code review (I9092), and had no CI guard at all until
# now. Baseline of pre-existing matches: .openrouter-allowlist.yaml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `caller-` prefix is load-bearing, not cosmetic: inside a CALLED workflow
  # `github.workflow` resolves to THIS workflow's name, so a callee declaring
  # the same expression lands in the same concurrency group and GitHub kills
  # the run with zero jobs and no check (alpha-engine-config-I7836/I7862).
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/openrouter-guard.yml@51cd22f479a9c917d165fa88e37204e98bc88ea7  # nousergon-lib main @ 2026-08-28
