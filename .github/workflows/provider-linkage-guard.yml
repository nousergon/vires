name: Provider direct-linkage guard

# Reusable-workflow caller: see the header comment in nousergon/nousergon-lib's
# own provider-linkage-guard.yml for the full rationale. Wired here by the
# fleet coverage rollout (alpha-engine-config-I9295). The legacy
# openrouter-guard.yml sees one vendor; this one sees every vendor, which is
# why vires' live STT linkage (vires-ops-I82) was invisible to CI until now.
# Pre-cleared matches: .provider-linkage-allowlist.yaml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caller-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/provider-linkage-guard.yml@15dbb42f5737ed3a58a363f2daade65bd936d675
